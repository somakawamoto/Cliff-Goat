<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>崖ヤギ</title>
    <link rel="stylesheet" href="styles.css?v=20260503-4" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="崖ヤギゲーム画面"></canvas>

      <div class="left-hud-stack">
        <section class="hud hud-score" aria-live="polite">
          <span class="label">占有率</span>
          <strong id="coverage">0.0%</strong>
          <span class="meter"><i id="coverageBar"></i></span>
          <span class="label">スコア</span>
          <b id="score">0 pt</b>
        </section>

        <section class="paper daily">
          <p>ベスト: <b id="bestCoverage">0.0%</b></p>
          <p>ランキング: <b id="rank">132</b>位</p>
        </section>

        <section class="hud combo" id="comboPanel">
          <span class="label">コンボ</span>
          <strong><span id="combo">0</span><small>連続!</small></strong>
          <hr />
          <span id="lastBonus">隣接ボーナス<br />+0 pt</span>
        </section>
      </div>

      <section class="hud hud-goats">
        <span class="label">貼付ヤギ</span>
        <strong><span id="remaining">0</span><small>匹</small></strong>
        <span class="miss-label">失敗 <b id="misses">0</b>/3</span>
      </section>

      <button id="menuButton" class="round-button" aria-label="メニュー">☰</button>
      <button id="soundButton" class="sound-button" type="button" aria-label="音をオフ" aria-pressed="true">
        <img id="soundIcon" src="assets/sound-on.svg?v=20260503-1" alt="" />
        <span id="soundLabel" class="visually-hidden">音 ON</span>
      </button>

      <section class="next-card">
        <h2>NEXT ヤギ</h2>
        <canvas id="nextGoat" width="220" height="170" aria-label="次のヤギ"></canvas>
        <span id="nextBadge" class="badge">M</span>
      </section>

      <div class="power-wrap">
        <span>パワー</span>
        <div class="power-track"><i id="powerBar"></i></div>
      </div>

      <div id="result" class="result" hidden>
        <section class="result-card">
          <p class="overline">RESULT</p>
          <h2 id="resultTitle">崖埋め完了</h2>
          <dl>
            <div><dt>崖埋め率</dt><dd id="resultCoverage">0.0%</dd></div>
            <div><dt>ランク</dt><dd id="resultRank">C</dd></div>
            <div><dt>スコア</dt><dd id="resultScore">0 pt</dd></div>
            <div><dt>配置数</dt><dd id="resultPlaced">0 匹</dd></div>
          </dl>
          <div class="result-actions">
            <button id="shareButton">画像を共有</button>
            <button id="retryButton">もう一度</button>
          </div>
        </section>
      </div>
    </main>

    <script src="game.js?v=20260503-6"></script>
  </body>
</html>
